services:

  # --- Backend SupplyChainX ---
  supplychainx:
    build: .
    container_name: supplychainx
    ports:
      - "8084:8080"
    depends_on:
      - db
      - sonarqube
      - logstash
    environment:
      DB_USER: root
      DB_PASSWORD: Latifa11
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/supplychainxDb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: always
    networks:
      - elk

  # --- Base de données MySQL ---
  db:
    image: mysql:8.1
    container_name: supplychainx-db
    environment:
      MYSQL_ROOT_PASSWORD: Latifa11
      MYSQL_DATABASE: supplychainxDb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    networks:
      - elk

  # --- SonarQube ---
  sonarqube:
    image: sonarqube:10-community
    container_name: supplychainx-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    restart: always
    networks:
      - elk

  # --- Elasticsearch ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - elk

  # --- Logstash ---
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    networks:
      - elk

  # --- Kibana ---
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk

volumes:
  db_data:

networks:
  elk:
    driver: bridge
