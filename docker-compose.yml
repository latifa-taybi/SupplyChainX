version: '3.9'

services:

  # --- Backend SupplyChainX ---
  supplychainx:
    build: .
    container_name: supplychainx
    ports:
      - "8080:8080"
    depends_on:
      - db
      - sonarqube
    environment:
      # Variables pour Spring Boot
      DB_USER: root
      DB_PASSWORD: Latifa11
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/supplychainxDb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: always

  # --- Base de données MySQL ---
  db:
    image: mysql:8.1
    container_name: supplychainx-db
    environment:
      MYSQL_ROOT_PASSWORD: Latifa11
      MYSQL_DATABASE: supplychainxDb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  # --- SonarQube pour analyse du code ---
  sonarqube:
    image: sonarqube:10-community
    container_name: supplychainx-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    restart: always

# --- Volumes pour persistance des données ---
volumes:
  db_data:
